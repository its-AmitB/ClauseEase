version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_GATEWAY_URL=http://localhost:5000/api
    depends_on:
      - gateway

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/clauseease
      - JWT_SECRET=${JWT_SECRET:-clauseease_default_secret}
      - ML_SERVICE_URL=http://ml_service:8000
    depends_on:
      - mongo
      - ml_service

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ml_models_cache:/root/.cache/huggingface

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  ml_models_cache:
